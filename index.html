<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM Endurance Planner</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-yellow: #ccff00;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(204, 255, 0, 0.2);
        }
        h1 {
            color: var(--accent-yellow);
            margin-bottom: 5px;
            font-size: 22px;
            text-transform: uppercase;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-discord:hover {
            background-color: #4752c4;
        }
        .hidden { display: none; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #1a2642;
            color: var(--accent-yellow);
        }
        td.day-cell {
            text-align: left;
            font-weight: bold;
            background-color: #162038;
        }
        input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
        }
        .input-name {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #162038;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .categories-box {
            margin: 20px 0;
            padding: 15px;
            background-color: #162038;
            border-radius: 8px;
        }
        .categories-box label {
            margin-right: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-save:hover {
            opacity: 0.9;
        }
        .success-msg {
            background-color: rgba(204, 255, 0, 0.1);
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- PAGE 1 : CONNEXION -->
    <div id="login-section" class="container" style="text-align: center; max-width: 500px;">
        <h1>SPM ENDURANCE PLANNER</h1>
        <p class="subtitle">Connecte-toi pour accéder au planning de la course.</p>
        <button id="btn-login" class="btn-discord">
            Se connecter avec Discord
        </button>
    </div>

    <!-- PAGE 2 : GRILLE DE DISPO -->
    <div id="planner-section" class="container hidden">
        <h1 id="race-title-display">Chargement de la course...</h1>
        <p class="subtitle">Indique ton pseudo, coche tes créneaux et valide pour envoyer sur Discord.</p>

        <input type="text" id="pilote-nom" class="input-name" placeholder="Ton Pseudo / Pilote (ex: Yoan_SPM)">

        <table>
            <thead>
                <tr id="table-header">
                    <th>Date / Heure</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>

        <div class="categories-box">
            <strong>Catégorie souhaitée :</strong><br><br>
            <label><input type="radio" name="cat" value="Hypercar"> Hypercar</label>
            <label><input type="radio" name="cat" value="LMGT3"> LMGT3</label>
            <label><input type="radio" name="cat" value="Les deux"> Les deux / Indifférent</label>
        </div>

        <button id="btn-submit" class="btn-save">Envoyer mes disponibilités sur Discord</button>
        
        <div id="success-message" class="success-msg">
            ✅ Envoyé avec succès sur le salon Discord de l'équipe !
        </div>
    </div>

    <script>
        const CONFIG_COURSE = {
            nom: "Endurance 6H de Fuji",
            horaires: ["02h00", "07h00", "12h00", "17h00", "22h00"],
            jours: [
                { nom: "Ven. 02 Oct", dateCode: "Ven_02" },
                { nom: "Sam. 03 Oct", dateCode: "Sam_03" },
                { nom: "Dim. 04 Oct", dateCode: "Dim_04" }
            ]
        };

        const webhookURL = "https://discord.com/api/webhooks/1554222081875382364/EqaCFdbIGbRYc8s70u_brnYigSAVVb4Cg6O0TRVeGiwwqf37za9qrh1Rw3pQYZ1dJVbI?thread_id=1554104142539264070";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('race-title-display').innerText = CONFIG_COURSE.nom;

            const headerTr = document.getElementById('table-header');
            CONFIG_COURSE.horaires.forEach(heure => {
                const th = document.createElement('th');
                th.innerText = heure;
                headerTr.appendChild(th);
            });

            const tbody = document.getElementById('table-body');
            CONFIG_COURSE.jours.forEach(jour => {
                const tr = document.createElement('tr');
                
                const tdDay = document.createElement('td');
                tdDay.className = 'day-cell';
                tdDay.innerText = jour.nom;
                tr.appendChild(tdDay);

                CONFIG_COURSE.horaires.forEach(heure => {
                    const td = document.createElement('td');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'slot';
                    checkbox.setAttribute('data-time', `${jour.nom} - ${heure}`);
                    td.appendChild(checkbox);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            document.getElementById('btn-login').addEventListener('click', () => {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('planner-section').classList.remove('hidden');
            });

            document.getElementById('btn-submit').addEventListener('click', () => {
                const nom = document.getElementById('pilote-nom').value.trim();
                if (!nom) {
                    alert("Merci d'indiquer ton pseudo avant d'envoyer !");
                    return;
                }

                let selectedCat = "Non spécifiée";
                const cats = document.getElementsByName('cat');
                for (let c of cats) {
                    if (c.checked) selectedCat = c.value;
                }

                let slots = [];
                const checkboxes = document.querySelectorAll('.slot');
                checkboxes.forEach(box => {
                    if (box.checked) {
                        slots.push(box.getAttribute('data-time'));
                    }
                });

                const payload = {
                    content: `🏎️ **Nouvelles disponibilités : ${CONFIG_COURSE.nom}**\n👤 **Pilote :** ${nom}\n🏁 **Catégorie :** ${selectedCat}\n📅 **Créneaux :** ${slots.length > 0 ? slots.join(', ') : 'Aucun créneau sélectionné'}`
                };

                fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('success-message').style.display = 'block';
                    } else {
                        alert("Erreur lors de l'envoi vers Discord.");
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert("Erreur de connexion avec le Webhook.");
                });
            });
        });
    </script>
</body>
</html>
