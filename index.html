<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM Endurance Planner</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-yellow: #ccff00;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(204, 255, 0, 0.2);
        }
        h1 {
            color: var(--accent-yellow);
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-discord:hover {
            background-color: #4752c4;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SPM ENDURANCE PLANNER</h1>
        <p>Connecte-toi avec ton compte Discord pour accéder au planning de l'équipe et indiquer tes disponibilités.</p>

</html>
